name: Keep caches warm

permissions: {}

on:
  schedule:
    - cron: '7 5 * * *'

  pull_request:
    paths:
      - '.github/workflows/keep-caches-warm.yml'

  workflow_dispatch:

concurrency:
  group: keep-caches-warm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sweep:
    uses: gigabit-clowns/.github/.github/workflows/keep-caches-warm.yml@main
    with:
      entries: >-
        [
          {"os": "ubuntu-latest", "prefix": "v0-rust-cargo-ubuntu-latest"},
          {"os": "macos-latest", "prefix": "v0-rust-cargo-macos-latest"},
          {"os": "windows-latest", "prefix": "v0-rust-cargo-windows-latest"},
          {"os": "ubuntu-latest", "prefix": "v0-rust-pip-ubuntu-latest"},
          {"os": "macos-latest", "prefix": "v0-rust-pip-macos-latest"},
          {"os": "windows-latest", "prefix": "v0-rust-pip-windows-latest"},
          {"os": "ubuntu-latest", "prefix": "v0-rust-bench-ubuntu-latest"},
          {"os": "ubuntu-latest", "prefix": "v0-rust-coverage-ubuntu-latest"}
        ]
