name: Documentation

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - src/**
      - python/**
      - docs/pdoc/**
      - docs/assets/**
      - scripts/docs.py
      - Cargo.toml
      - Cargo.lock
      - pyproject.toml
      - README.md
      - .github/workflows/documentation.yml

  pull_request:
    paths:
      - src/**
      - python/**
      - docs/pdoc/**
      - docs/assets/**
      - scripts/docs.py
      - Cargo.toml
      - Cargo.lock
      - pyproject.toml
      - README.md
      - .github/workflows/documentation.yml

  workflow_dispatch:

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.14'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Cache the Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: docs
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install the package and pdoc
        run: pip install . --group docs

      - name: Build the Python reference
        run: python -W error -m scripts.docs site

      - name: Build the Rust reference
        run: |
          cargo doc --locked --no-deps --document-private-items
          cp -r target/doc site/rust

      - name: Set up Pages
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Keep the site for Pages
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  publish:
    name: Publish to GitHub Pages
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
