name: Build and test

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - .gitignore
      - .vscode/**
      - LICENSE
      - renovate.json

  pull_request:

  workflow_dispatch:

concurrency:
  group: build-and-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_with_cargo:
    name: Cargo / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.14'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy

      - name: Cache the Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: cargo-${{ matrix.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check formatting
        run: cargo fmt --check

      - name: Build
        run: cargo build --locked --verbose

      - name: Run tests
        run: cargo test --locked --verbose

      - name: Run clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.14'

      - name: Install the linters
        run: 'pip install --only-binary :all: --group lint'

      - name: Run ruff
        run: ruff check .

      - name: Check cognitive complexity
        run: complexipy python tests --max-complexity-allowed 7 --quiet

      - name: Check types
        run: mypy

  build_with_pip:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}${{ matrix.extras == 'oldest' && ' / oldest extras' || '' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14', '3.15']
        extras: [newest]
        include:
          - os: ubuntu-latest
            python-version: '3.10'
            extras: oldest

    runs-on: ${{ matrix.os }}
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Cache the Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: pip-${{ matrix.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # h5py has no 3.15 wheel yet, and building one means building libhdf5.
      - name: Install package and test dependencies
        run: pip install ".[test${{ matrix.python-version != '3.15' && ',hdf5' || '' }}]" -v

      - name: Install the oldest extras this package claims
        if: matrix.extras == 'oldest'
        run: 'pip install --only-binary :all: "polars==1.0.0" "pandas==2.2.2" "h5py==3.11.0"'

      - name: Run tests
        run: pytest tests/python/
