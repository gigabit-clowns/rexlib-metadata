name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - src/**
      - python/**
      - Cargo.toml
      - Cargo.lock
      - pyproject.toml
      - README.md
      - LICENSE
      - .github/workflows/release.yml

  pull_request:
    branches:
      - main
    paths:
      - Cargo.toml
      - Cargo.lock
      - pyproject.toml
      - .github/workflows/release.yml

  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.14'

      - name: Build the source distribution
        run: |
          python -m pip install --only-binary :all: --group sdist
          python -m build --sdist

      - name: Keep the source distribution
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sdist
          path: dist/rexlib_metadata-*.tar.gz
          if-no-files-found: error

  wheels:
    name: Build wheels for ${{ matrix.os }} (${{ matrix.architectures }})
    needs: sdist
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            architectures: x86_64
          - os: ubuntu-24.04-arm
            architectures: aarch64
          - os: macos-latest
            architectures: arm64
          - os: macos-15-intel
            architectures: x86_64
          - os: windows-latest
            architectures: AMD64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Fetch the source distribution
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: sdist
          path: dist

      - name: Find the source distribution
        id: sdist
        run: echo "path=$(ls dist/rexlib_metadata-*.tar.gz)" >> "$GITHUB_OUTPUT"

      # The manylinux containers have no Rust.
      - name: Build and test the wheels
        uses: pypa/cibuildwheel@b3395e271a35f73dad77f21802abe9b986dfe299 # v4.3.1
        with:
          package-dir: ${{ steps.sdist.outputs.path }}
          output-dir: wheelhouse
        env:
          CIBW_BUILD: cp310-* cp311-* cp312-* cp313-* cp314-*
          CIBW_SKIP: '*-musllinux_*'
          CIBW_ARCHS: ${{ matrix.architectures }}
          CIBW_BEFORE_ALL_LINUX: curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          CIBW_ENVIRONMENT_LINUX: PATH="$HOME/.cargo/bin:$PATH"
          CIBW_ENVIRONMENT_MACOS: MACOSX_DEPLOYMENT_TARGET=11.0
          CIBW_TEST_GROUPS: test
          CIBW_TEST_EXTRAS: hdf5
          CIBW_TEST_COMMAND: pytest {project}/tests/python

      - name: Keep the wheels
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  development:
    name: Development prerelease
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - sdist
      - wheels
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Fetch the distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: dist
          merge-multiple: true

      - name: Replace the development prerelease
        run: |
          gh release delete development --cleanup-tag --yes || true
          gh release create development dist/* \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Development build" \
            --notes "The head of main, built at $GITHUB_SHA. Not a release."

  # Off until the package name is settled (#40).
  publish:
    name: Publish to PyPI
    if: false && startsWith(github.ref, 'refs/tags/v')
    needs:
      - sdist
      - wheels
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/rexlib-metadata/
    permissions:
      id-token: write
    steps:
      - name: Fetch the distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
