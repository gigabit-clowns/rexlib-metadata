name: Clean up caches
permissions: {}

on:
  workflow_run:
    workflows:
      - Build and test
      - Benchmarks
      - CodeQL
      - Documentation
    types:
      - completed
    branches:
      - main

  workflow_dispatch:
    inputs:
      scope:
        description: Which caches go
        required: true
        type: choice
        options:
          - superseded
          - all
        default: superseded
      ref:
        description: Ref or branch to clean. The one this runs from when empty.
        required: false
        type: string

jobs:
  after_a_build:
    permissions:
      actions: write
    name: Delete the caches a newer run has replaced
    if: github.event_name == 'workflow_run'
    uses: gigabit-clowns/.github/.github/workflows/clean-up-caches.yml@main
    with:
      scope: superseded
      tails: &tails >-
        [
          "(-[0-9a-f]{8}){2}$",
          "-[0-9]+(\\.[0-9]+)+-[0-9a-f]{40}-[0-9]+-[0-9]+$",
          "-ubuntu-[0-9.]+-.*$"
        ]

  on_request:
    permissions:
      actions: write
    name: Delete ${{ inputs.scope }} caches
    if: github.event_name == 'workflow_dispatch'
    uses: gigabit-clowns/.github/.github/workflows/clean-up-caches.yml@main
    with:
      scope: ${{ inputs.scope }}
      ref: ${{ inputs.ref != '' && inputs.ref || github.ref_name }}
      tails: *tails
