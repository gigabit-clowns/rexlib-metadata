[build-system]
requires      = ["maturin==1.15.0"]
build-backend = "maturin"

[project]
name        = "rexlib-metadata"
dynamic     = ["version"]
description = "Read and write CryoEM metadata formats (STAR, XMD, SQLite) to Pandas/Polars DataFrames. Rust core, Python API, extensible by design."
readme      = { file = "README.md", content-type = "text/markdown" }
license       = "LGPL-2.1-or-later"
license-files = ["LICENSE"]
authors     = [
    { name = "Martin Salinas", email = "ssalinasmartin@gmail.com" },
]
requires-python = ">=3.10"
classifiers = [
    "Topic :: Scientific/Engineering :: Image Processing",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Rust",
    "Typing :: Typed",
]
dependencies = [
    "pyarrow==25.0.1; python_version == '3.10'",
    "pyarrow==26.0.0; python_version >= '3.11'",
]

[project.optional-dependencies]
test   = [
    "pytest==9.2.0",
    "pandas==2.3.3; python_version == '3.10'",
    "pandas==3.1.0; python_version >= '3.11'",
    "polars==2.0.0; python_version == '3.10'",
    "polars==2.1.0; python_version >= '3.11'",
]
pandas = [
    "pandas>=2.2.2,<3.0; python_version == '3.10'",
    "pandas>=3.0; python_version >= '3.11'",
]
polars = ["polars>=1.0"]

[dependency-groups]
lint = [
    "ruff==0.17.3",
    "complexipy==8.3.0",
    "mypy==2.4.1",
    "pyarrow-stubs==20.0.0.20260819",
    "pandas-stubs==3.0.5.260914",
    "polars==2.1.0",
]

[project.urls]
Homepage = "https://github.com/gigabit-clowns/rexlib-metadata"
Issues   = "https://github.com/gigabit-clowns/rexlib-metadata/issues"

[tool.maturin]
python-source = "python"
module-name   = "rexlib_metadata._rexlib"
features      = ["pyo3/extension-module"]

[tool.mypy]
files          = ["python/rexlib_metadata"]
python_version = "3.10"

[tool.pytest.ini_options]
testpaths = ["tests/python"]
