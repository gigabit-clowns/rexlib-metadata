[package]
name = "rexlib-metadata"
version = "0.1.0"
edition = "2024"

[lib]
name = "rexlib_metadata"
crate-type = ["cdylib"]

[dependencies]
pyo3       = "0.30"
arrow      = { version = "59", default-features = false }
pyo3-arrow = "0.19"
thiserror  = "2"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code     = "forbid"
unreachable_pub = "warn"

[lints.clippy]
cognitive_complexity = "warn"
indexing_slicing     = "warn"
unwrap_used          = "warn"
use_self             = "warn"
pedantic             = { level = "warn", priority = -1 }
