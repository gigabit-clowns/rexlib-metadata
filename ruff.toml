target-version = "py310"
line-length = 80

include = [
    "python/**/*.py",
    "tests/**/*.py"
]

[lint]
select = ["E4", "E5", "E7", "E9", "F"]
extend-select = [
    "I",    # isort
    "UP",   # pyupgrade
    "D",    # pydocstyle
    "PL",   # pylint
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RET",  # flake8-return
    "PIE",  # flake8-pie
    "PERF", # perflint
    "RUF",  # ruff-specific rules
]

[lint.per-file-ignores]
"tests/**/*.py" = [
    "D",       # docstrings are not required in tests
    "PLC0414", # Useless import alias
    "PLR0913", # Too many arguments in function definition
    "PLR0917", # Too many positional arguments
    "PLR2004"  # Asserting against literal values is the point of a test
]

[lint.isort]
known-first-party = ["rexlib_metadata"]

[lint.pydocstyle]
convention = "pep257"
